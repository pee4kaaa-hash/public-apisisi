  <text x="152" y="146" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="152" dy="0">щитовидный</tspan><tspan x="152" dy="25">хрящ</tspan></text><path d="M304,228 L420,205" stroke="#4a5563" stroke-width="2.5"/><circle cx="304" cy="228" r="5" fill="#4a5563"/>
  <text x="428" y="201" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="428" dy="0">перстневидный</tspan><tspan x="428" dy="25">хрящ</tspan></text><path d="M300,272 L420,262" stroke="#4a5563" stroke-width="2.5"/><circle cx="300" cy="272" r="5" fill="#4a5563"/>
  <text x="428" y="270" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="428" dy="0">перешеек</tspan></text><path d="M230,300 L120,330" stroke="#4a5563" stroke-width="2.5"/><circle cx="230" cy="300" r="5" fill="#4a5563"/>
  <text x="112" y="338" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="112" dy="0">правая доля</tspan></text><path d="M282,380 L420,360" stroke="#4a5563" stroke-width="2.5"/><circle cx="282" cy="380" r="5" fill="#4a5563"/>
  <text x="428" y="368" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="428" dy="0">трахея</tspan></text></g>
  <text x="24" y="575" font-size="23" fill="#1f2933"><tspan font-weight="800">Осмотр</tspan></text><text x="40" y="607" font-size="21" fill="#334155">• железа не видна, контур шеи ровный</text><text x="24" y="648" font-size="23" fill="#1f2933"><tspan font-weight="800">Пальпация</tspan></text><text x="40" y="680" font-size="21" fill="#334155">• мягкая, безболезненная, однородная</text><text x="40" y="709" font-size="21" fill="#334155">• смещается вверх при глотании</text><text x="24" y="750" font-size="23" fill="#1f2933"><tspan font-weight="800">Анатомия</tspan></text><text x="40" y="782" font-size="21" fill="#334155">• перешеек на уровне II–IV колец трахеи</text><text x="40" y="811" font-size="21" fill="#334155">• доли по бокам от гортани и трахеи</text><text x="24" y="852" font-size="23" fill="#1f2933"><tspan font-weight="800">УЗИ</tspan></text><text x="40" y="884" font-size="21" fill="#334155">• объём: мужчины ≤ 25 мл, женщины ≤ 18 мл</text></g><g transform="translate(625,140)">
  <rect width="560" height="1010" rx="26" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="0" y="0" width="560" height="66" rx="26" fill="#c99400"/><rect x="0" y="40" width="560" height="26" fill="#c99400"/>
  <text x="280" y="45" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">2. Диффузный зоб</text>
  <g transform="translate(0,80)"><path d="M110,30 Q200,120 280,118 Q360,120 450,30" fill="none" stroke="#c99f86" stroke-width="5"/>
