<text x="1200" y="70" text-anchor="middle" font-size="46" font-weight="900" fill="#1f2933">Щитовидная железа: от нормы до подозрения на рак</text>
<text x="1200" y="112" text-anchor="middle" font-size="24" fill="#52606d">Учебная схема на условной модели шеи, вид спереди («просвечивание»). Не для диагностики.</text><g transform="translate(35,140)">
  <rect width="560" height="1010" rx="26" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="0" y="0" width="560" height="66" rx="26" fill="#2e9d5b"/><rect x="0" y="40" width="560" height="26" fill="#2e9d5b"/>
  <text x="280" y="45" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">1. Норма</text>
