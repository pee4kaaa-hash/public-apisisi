  <path d="M60,420 Q170,385 262,402 M498,420 Q390,385 298,402" fill="none" stroke="#d9b49e" stroke-width="5" stroke-linecap="round"/><rect x="262" y="236" width="36" height="170" rx="6" fill="#dfe9f3" stroke="#9fb3c8" stroke-width="3"/><path d="M262,246 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,260 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,274 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,288 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,302 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,316 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,330 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,344 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,358 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,372 H298" stroke="#9fb3c8" stroke-width="3"/><path d="M262,386 H298" stroke="#9fb3c8" stroke-width="3"/>
  <path d="M248,140 L312,140 L302,200 L280,216 L258,200 Z" fill="#e8eef5" stroke="#8fa3b8" stroke-width="4"/>
  <path d="M272,140 L280,152 L288,140" fill="none" stroke="#8fa3b8" stroke-width="3"/>
  <rect x="256" y="220" width="48" height="16" rx="6" fill="#e8eef5" stroke="#8fa3b8" stroke-width="3"/><g fill="#e98a8a" stroke="#b5525a" stroke-width="4" opacity=".93">
