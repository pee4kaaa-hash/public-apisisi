name: "Med study site"

on:
  push:
    branches: [ master ]
    paths:
      - 'MED_STUDY_RU.md'
      - 'docs/**'
      - 'scripts/med_site/**'
      - '.github/workflows/med_site.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'MED_STUDY_RU.md'
      - 'docs/**'
      - 'scripts/med_site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build docs/data.json from MED_STUDY_RU.md
        run: python scripts/med_site/build.py

      - name: Check that committed data.json is up to date
        run: git diff --exit-code docs/data.json || (echo "::error::Запустите python scripts/med_site/build.py и закоммитьте docs/data.json" && exit 1)

      - name: Run tests
        run: cd scripts && python -m unittest tests.test_med_site --verbose

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
