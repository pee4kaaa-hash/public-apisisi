  <ellipse cx="315.28" cy="272" rx="23.76" ry="47.52" transform="rotate(10 315.28 272)"/>
  <rect x="250" y="261.68" width="60" height="22.8" rx="10"/></g><path d="M300,250 L318,238 L332,252 L348,246 L346,266 L358,280 L342,292 L346,310 L326,304 L312,316 L304,298 L292,288 L300,272 Z" fill="#9b2335" stroke="#5c0f1c" stroke-width="4"/>
      <g fill="#8e6bbf" stroke="#4b2f78" stroke-width="3"><ellipse cx="400" cy="230" rx="14" ry="10"/><ellipse cx="410" cy="268" rx="16" ry="11"/><ellipse cx="404" cy="306" rx="14" ry="10"/></g><path d="M338,262 L438,170" stroke="#4a5563" stroke-width="2.5"/><circle cx="338" cy="262" r="5" fill="#4a5563"/>
  <text x="446" y="154" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="446" dy="0">плотный</tspan><tspan x="446" dy="25">бугристый</tspan><tspan x="446" dy="25">узел</tspan></text><path d="M422,270 L445,315" stroke="#4a5563" stroke-width="2.5"/><circle cx="422" cy="270" r="5" fill="#4a5563"/>
  <text x="453" y="311" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="453" dy="0">шейные</tspan><tspan x="453" dy="25">лимфоузлы</tspan></text><path d="M300,258 L180,175" stroke="#4a5563" stroke-width="2.5"/><circle cx="300" cy="258" r="5" fill="#4a5563"/>
  <text x="172" y="159" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="172" dy="0">возвратный</tspan><tspan x="172" dy="25">гортанный нерв</tspan><tspan x="172" dy="25">→ осиплость</tspan></text></g>
  <text x="24" y="575" font-size="23" fill="#1f2933"><tspan font-weight="800">Тревожные признаки</tspan></text><text x="40" y="607" font-size="21" fill="#334155">• плотный, бугристый, малоподвижный узел</text><text x="40" y="636" font-size="21" fill="#334155">• быстрый рост за недели–месяцы</text><text x="40" y="665" font-size="21" fill="#334155">• увеличенные плотные шейные лимфоузлы</text><text x="40" y="694" font-size="21" fill="#334155">• осиплость, дисфагия, стридор</text><text x="24" y="735" font-size="23" fill="#1f2933"><tspan font-weight="800">УЗИ (подозрительно)</tspan></text><text x="40" y="767" font-size="21" fill="#334155">• гипоэхогенность, неровный край</text><text x="40" y="796" font-size="21" fill="#334155">• микрокальцинаты, «выше чем шире»</text><text x="40" y="825" font-size="21" fill="#334155">• выход за капсулу</text><text x="24" y="866" font-size="23" fill="#1f2933"><tspan font-weight="800">Типы рака</tspan></text><text x="40" y="898" font-size="21" fill="#334155">• папиллярный (~80 %), фолликулярный</text><text x="40" y="927" font-size="21" fill="#334155">• медуллярный (кальцитонин), анапластический</text><text x="24" y="968" font-size="23" fill="#1f2933"><tspan font-weight="800">Диагноз</tspan></text><text x="40" y="1000" font-size="21" fill="#334155">• только ТАБ + цитология (Bethesda)</text></g><text x="1200" y="1195" text-anchor="middle" font-size="20" fill="#52606d">Пороги ТАБ — ACR TI-RADS (2017). Окончательный диагноз ставится только по цитологии/гистологии.</text></svg>