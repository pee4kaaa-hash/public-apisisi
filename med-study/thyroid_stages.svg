  <ellipse cx="326" cy="272" rx="38.5" ry="77" transform="rotate(10 326 272)"/>
  <rect x="250" y="259" width="60" height="29.5" rx="10"/></g><path d="M214,250 L110,225" stroke="#4a5563" stroke-width="2.5"/><circle cx="214" cy="250" r="5" fill="#4a5563"/>
  <text x="102" y="221" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="102" dy="0">обе доли</tspan><tspan x="102" dy="25">увеличены</tspan></text><path d="M282,262 L420,222" stroke="#4a5563" stroke-width="2.5"/><circle cx="282" cy="262" r="5" fill="#4a5563"/>
  <text x="428" y="218" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="428" dy="0">утолщённый</tspan><tspan x="428" dy="25">перешеек</tspan></text><path d="M170,300 L120,350" stroke="#4a5563" stroke-width="2.5"/><circle cx="170" cy="300" r="5" fill="#4a5563"/>
  <text x="112" y="346" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="112" dy="0">сглажен</tspan><tspan x="112" dy="25">контур</tspan></text></g>
  <text x="24" y="575" font-size="23" fill="#1f2933"><tspan font-weight="800">Осмотр</tspan></text><text x="40" y="607" font-size="21" fill="#334155">• равномерно «полная» шея, контур сглажен</text><text x="24" y="648" font-size="23" fill="#1f2933"><tspan font-weight="800">Пальпация</tspan></text><text x="40" y="680" font-size="21" fill="#334155">• обе доли увеличены равномерно</text><text x="40" y="709" font-size="21" fill="#334155">• мягко-эластичная, безболезненная</text><text x="40" y="738" font-size="21" fill="#334155">• смещается при глотании</text><text x="24" y="779" font-size="23" fill="#1f2933"><tspan font-weight="800">Частые причины</tspan></text><text x="40" y="811" font-size="21" fill="#334155">• дефицит йода</text><text x="40" y="840" font-size="21" fill="#334155">• болезнь Грейвса (+ тиреотоксикоз)</text><text x="40" y="869" font-size="21" fill="#334155">• тиреоидит Хашимото</text><text x="24" y="910" font-size="23" fill="#1f2933"><tspan font-weight="800">Обследование</tspan></text><text x="40" y="942" font-size="21" fill="#334155">• ТТГ, свободный Т4, антитела к ТПО</text><text x="40" y="971" font-size="21" fill="#334155">• УЗИ щитовидной железы</text></g><g transform="translate(1215,140)">
  <rect width="560" height="1010" rx="26" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="0" y="0" width="560" height="66" rx="26" fill="#d9731a"/><rect x="0" y="40" width="560" height="26" fill="#d9731a"/>
  <text x="280" y="45" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">3. Одиночный узел</text>
