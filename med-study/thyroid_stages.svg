  <path d="M248,140 L312,140 L302,200 L280,216 L258,200 Z" fill="#e8eef5" stroke="#8fa3b8" stroke-width="4"/>
  <path d="M272,140 L280,152 L288,140" fill="none" stroke="#8fa3b8" stroke-width="3"/>
  <rect x="256" y="220" width="48" height="16" rx="6" fill="#e8eef5" stroke="#8fa3b8" stroke-width="3"/><g fill="#e98a8a" stroke="#b5525a" stroke-width="4" opacity=".93">
  <ellipse cx="245.2" cy="272" rx="23.1" ry="46.2" transform="rotate(-10 245.2 272)"/>
  <ellipse cx="314.8" cy="272" rx="23.1" ry="46.2" transform="rotate(10 314.8 272)"/>
  <rect x="250" y="261.8" width="60" height="22.5" rx="10"/></g><circle cx="238" cy="288" r="18" fill="#f6c3a8" stroke="#8a4b2a" stroke-width="4"/><path d="M226,296 L110,330" stroke="#4a5563" stroke-width="2.5"/><circle cx="226" cy="296" r="5" fill="#4a5563"/>
  <text x="102" y="338" text-anchor="end" font-size="22" fill="#1f2933"><tspan x="102" dy="0">узел в доле</tspan></text><path d="M320,272 L425,262" stroke="#4a5563" stroke-width="2.5"/><circle cx="320" cy="272" r="5" fill="#4a5563"/>
  <text x="433" y="258" text-anchor="start" font-size="22" fill="#1f2933"><tspan x="433" dy="0">здоровая</tspan><tspan x="433" dy="25">доля</tspan></text></g>
  <text x="24" y="575" font-size="23" fill="#1f2933"><tspan font-weight="800">Осмотр</tspan></text><text x="40" y="607" font-size="21" fill="#334155">• ограниченное выбухание с одной стороны</text><text x="40" y="636" font-size="21" fill="#334155">• часто не виден, находка на УЗИ</text><text x="24" y="677" font-size="23" fill="#1f2933"><tspan font-weight="800">Пальпация</tspan></text><text x="40" y="709" font-size="21" fill="#334155">• гладкий, эластичный, подвижный</text><text x="40" y="738" font-size="21" fill="#334155">• смещается вместе с железой</text><text x="24" y="779" font-size="23" fill="#1f2933"><tspan font-weight="800">Важно</tspan></text><text x="40" y="811" font-size="21" fill="#334155">• большинство узлов (> 90 %) доброкачественные</text><text x="24" y="852" font-size="23" fill="#1f2933"><tspan font-weight="800">Тактика</tspan></text><text x="40" y="884" font-size="21" fill="#334155">• ТТГ + УЗИ с оценкой по TI-RADS</text><text x="40" y="913" font-size="21" fill="#334155">• ТАБ по размеру и категории (ACR):</text><text x="40" y="942" font-size="21" fill="#334155">• TR3 ≥ 2,5 см · TR4 ≥ 1,5 см · TR5 ≥ 1 см</text></g><g transform="translate(1805,140)">
  <rect width="560" height="1010" rx="26" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="0" y="0" width="560" height="66" rx="26" fill="#c62828"/><rect x="0" y="40" width="560" height="26" fill="#c62828"/>
  <text x="280" y="45" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">4. Подозрение на рак</text>
